name: Temporary live-site check

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check published homepage
        shell: bash
        run: |
          set +e
          curl -sS -L --retry 8 --retry-all-errors --retry-delay 8 --connect-timeout 10 --max-time 45 \
            -o /tmp/pages-home.html \
            -w 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\nREMOTE_IP=%{remote_ip}\n' \
            "https://jetcity-chat.github.io/?livecheck=$(date +%s)"
          curl_status=$?
          echo "CURL_EXIT=$curl_status"
          if [ -f /tmp/pages-home.html ]; then
            echo "RESPONSE_BYTES=$(wc -c < /tmp/pages-home.html)"
            echo "RESPONSE_TITLE:"
            grep -io -m 1 '<title[^>]*>[^<]*</title>' /tmp/pages-home.html || true
            echo "RESPONSE_START:"
            head -c 500 /tmp/pages-home.html || true
            echo
          fi
          if [ "$curl_status" -ne 0 ]; then exit "$curl_status"; fi
